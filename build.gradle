// Top-level build file where you can add configuration options common to all sub-projects/modules.

task clean(type: Delete) {
    delete rootProject.buildDir
}

def versionPropsFile = file('version.properties')
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))

allprojects {
    version = versionProps['version']
}

task incrementVersion {
    doLast {
        def version = versionProps['version']
        def parts = version.split('\\.')
        parts[parts.length - 1] = (parts[parts.length - 1].toInteger() + 1).toString()
        version = parts.join('.')
        versionProps['version'] = version
        versionProps['buildDate'] = new Date().format('yyyy-MM-dd HH:mm')
        versionProps.store(versionPropsFile.newWriter(), null)
        
        allprojects {
            project.version = version
        }
        println "Version incremented to $version"
    }
}

subprojects {
    ext {
        JAVA_VERSION = 21
    }

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(JAVA_VERSION)
            }
            sourceCompatibility = JavaVersion.toVersion(JAVA_VERSION)
            targetCompatibility = JavaVersion.toVersion(JAVA_VERSION)
        }
    }
}


task buildAllDistributions {
    dependsOn incrementVersion
    dependsOn ':desktop:buildAllDistributions'

    doLast {
        println(" #### Check the individual modules build/distributions folders for distributable zips etc #### ")
    }
}

